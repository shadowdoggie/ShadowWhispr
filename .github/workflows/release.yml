name: Build and attach installer

# Runs whenever a GitHub release is published, and can be run by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3). Used when run manually."
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write   # needed to upload the installer to the release

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $v = "${{ github.event.release.tag_name }}"
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          $v = $v -replace '^v', ''
          if (-not $v) { $v = '0.0.0-dev' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "build/installer/ShadowWhispr-Setup-${{ steps.version.outputs.version }}.exe"
          gh release upload "${{ github.event.release.tag_name }}" "$setup" --clobber

      - name: Save the installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShadowWhispr-Setup
          path: build/installer/*.exe
