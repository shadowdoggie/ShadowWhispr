name: Build and attach installer

# Runs whenever a GitHub release is published, and can be run by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3). Used when run manually."
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write   # needed to upload the installer to the release

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: pwsh
        run: dotnet test --configuration Release --filter "FullyQualifiedName!~AiProviderDiscoveryTests"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $v = "${{ github.event.release.tag_name }}"
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          $v = $v -replace '^v', ''
          if (-not $v) { $v = '0.0.0-dev' }
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like 1.2.3 or 1.2.3-beta."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create installer checksum
        id: installer
        shell: pwsh
        run: |
          $setup = "build/installer/ShadowWhispr-Setup-${{ steps.version.outputs.version }}.exe"
          $checksum = "$setup.sha256"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" | Set-Content -LiteralPath $checksum -Encoding ascii
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Add the Windows safety notice to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          # Join into one string: PowerShell returns native command output as an
          # array of lines, which would flatten the notes and make the -notlike
          # check match per-line (always truthy) instead of on the whole body.
          $currentNotes = (gh release view $tag --json body --jq .body) -join "`n"
          if ($currentNotes -notlike '*Unknown publisher*') {
            $notice = @'
          > [!IMPORTANT]
          > **Windows may show “Unknown publisher”.** The official ShadowWhispr installer does not contain viruses or malware. This warning appears because the project does not use a paid code-signing certificate—not because Windows detected a threat. Download only the installer attached to this official release. A SHA-256 checksum is included for verification.
          '@
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            "$notice`n`n$currentNotes" | Set-Content -LiteralPath $notesPath -Encoding utf8
            gh release edit $tag --notes-file $notesPath
          }

      - name: Upload the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "${{ steps.installer.outputs.setup }}" `
            "${{ steps.installer.outputs.checksum }}" `
            --clobber

      - name: Save the installer as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ShadowWhispr-Setup
          path: build/installer/*
